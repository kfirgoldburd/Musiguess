button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:500}

button:disabled{opacity:.45}
input{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.pack{flex:1;min-width:30%;text-align:center}
.center{text-align:center}
.name{font-size:54px;font-weight:800;margin:40px 0 8px;line-height:1.1;color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:500;color:var(--mute)}
.bar b{color:var(--ink);font-size:26px;font-weight:800}
.player{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;margin-top:12px;text-align:center}
.disc{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;border:0;padding:0;font-size:34px;color:#fff;background:radial-gradient(circle,var(--acc2) 0 14%,#111 15% 100%);box-shadow:0 0 0 4px var(--acc);position:relative}
.disc.spin{animation:sp 2s linear infinite}

@media (prefers-reduced-motion:reduce){.disc.spin{animation:none}}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.tl{margin-top:14px;display:flex;flex-direction:column;align-items:stretch}
.slot{border:2px dashed var(--line);background:transparent;color:var(--mute);padding:9px;margin:5px 0;font-size:14px}
.slot.sel{border-style:solid;border-color:var(--acc);background:var(--acc);color:#fff;font-weight:800}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:2px 0;position:relative}
.song:before{content:"";position:absolute;inset-inline-start:-0px}
.art{width:52px;height:52px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800}

.yr{margin-inline-start:auto;font-size:24px;font-weight:800;color:var(--acc)}
.song.new{animation:pop .5s}

.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.note{font-size:13px;color:var(--mute);margin-top:16px;text-align:center}
.mock{background:var(--acc2);color:#1f1a4d;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500}

  }
  t0=performance.now();$('.disc').classList.add('spin');
  const tick=()=>{const k=Math.min((performance.now()-t0)/30000,1);const p=$('.prog i');if(p)p.style.width=k*100+'%';if(k<1)raf=requestAnimationFrame(tick);else stopAudio()};tick();
}
async function preview(s){if(AC[s.id]!==undefined)return AC[s.id];let r=null;try{const c=new AbortController();setTimeout(()=>c.abort(),3500);const j=await(await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(s.q||s.t+' '+s.a),{signal:c.signal})).json();const x=j.results[0];if(x&&x.previewUrl)r={u:x.previewUrl,art:(x.artworkUrl100||'').replace('100x100','300x300')}}catch(e){}AC[s.id]=r;return r}
function prog30(){const k=Math.min((performance.now()-t0)/30000,1);const p=$('.prog i');if(p)p.style.width=k*100+'%';if(k<1)raf=requestAnimationFrame(prog30)}
async function playSong(s){stopAudio();const my=++tok,tag=$('#mock');const p=await preview(s);if(my!==tok)return;if(p){try{au=new Audio(p.u);await au.play();tag.style.display='none';$('.disc').classList.add('spin');t0=performance.now();prog30();au.onended=stopAudio;return}catch(e){au=null}}tag.style.display='';playMock(s)}
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=523;g.gain.value=.15;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4);$('#snd').textContent='✓ השמע עובד'}catch(e){$('#snd').textContent='השמע לא זמין במכשיר'}}

/* ---------- game state ---------- */
let G={cnt:2,target:10,pack:"intl",names:["","","",""]};
function start(){
  const seen=ls.get();let pool=PK[G.pack].filter(x=>!seen.includes(x.id));if(pool.length<G.cnt*(G.target+2)){ls.set(seen.filter(id=>!PK[G.pack].some(x=>x.id===id)));pool=PK[G.pack]}const deck=shuffle(pool);
  G.players=Array.from({length:G.cnt},(_,i)=>({n:G.names[i].trim()||'שחקן '+(i+1),tl:[deck.pop()],sh:0,sw:0}));
  G.deck=deck;G.players.forEach(p=>markSeen(p.tl[0].id));G.cur=0;G.slot=null;G.song=null;
  G.cnt===1?turn():pass();
}
function pass(){
  stopAudio();const p=G.players[G.cur];
  $('#app').innerHTML=`<div class="center"><p class="sub">העבירו את הטלפון אל</p><div class="name">${p.n}</div><p class="sub">${p.tl.length} מתוך ${G.target} שירים על הציר</p><button class="big" onclick="turn()">אני מוכן</button></div>`;
}
function turn(fresh=true){
  if(fresh||!G.song){if(!G.deck.length)G.deck=shuffle(PK[G.pack]);G.song=G.deck.pop();G.slot=null;preview(G.song);}
  const p=G.players[G.cur];
  let tl='';for(let i=0;i<=p.tl.length;i++){tl+=`<button class="slot ${G.slot===i?'sel':''}" onclick="pick(${i})">${i==0?'לפני השיר הראשון':i==p.tl.length?'אחרי השיר האחרון':'בין השניים'}</button>`;if(i<p.tl.length)tl+=songRow(p.tl[i]);}
  $('#app').innerHTML=`<div class="bar"><span>התור של</span><span><b>${p.n}</b></span><span>${p.sh?'🛡️'.repeat(p.sh)+' ':''}${p.tl.length}/${G.target}</span></div>
  <div class="player"><button class="disc" aria-label="נגן" onclick="playSong(G.song)">▶</button><div class="prog"><i></i></div>
  <div class="row"><button class="soft" onclick="turn(true)">לא מתנגן, שיר אחר</button><button class="soft" style="flex-basis:100%" ${p.sw?'disabled':''} onclick="swap()">לא מכיר? החלפת שיר (פעם אחת)</button><button class="soft" onclick="playSong(G.song)">נסו שוב</button></div>
  <p class="note" style="margin:10px 0 0"><span class="mock" id="mock" style="display:none">השמע האמיתי לא זמין כאן, מתנגנת מנגינה בדויה</span></p></div>
  <h2>איפה השיר על הציר?</h2><div class="tl">${tl}</div>
  <button class="big" ${G.slot===null?'disabled':''} onclick="confirmPlace()">אישור</button>`;
}
function pick(i){G.slot=i;const y=scrollY;turn(false);scrollTo(0,y)}
function confirmPlace(){
  let i=G.slot;stopAudio();const p=G.players[G.cur],s=G.song;markSeen(s.id);
  const prev=i>0?p.tl[i-1].y:-Infinity,next=i<p.tl.length?p.tl[i].y:Infinity;
  let ok=prev<=s.y&&s.y<=next,saved=false;
  if(!ok&&(p.sh||0)>0){p.sh--;saved=true;ok=true;i=p.tl.filter(x=>x.y<=s.y).length}
  if(ok)p.tl.splice(i,0,s);
  if(ok&&!saved)return bonus(s);
  res(ok,saved,null);
}
function res(ok,saved,bn){
  const p=G.players[G.cur],s=G.song;
  const win=ok&&p.tl.length>=G.target;
  $('#app').innerHTML=`<div class="center"><div class="res ${ok?'ok':'bad'}">${saved?'כמעט!':ok?'צדקת!':'לא הפעם'}</div>
  <p class="sub">${saved?'המגן הציל אותך, השיר ממוקם במקום הנכון':ok?'השיר נשאר על הציר שלך':'השיר יצא מהמשחק'}</p>${bn===true?'<p class="sub">🛡️ הבונוס נכון, קיבלת מגן מטעות עתידית</p>':bn===false?'<p class="sub">הבונוס לא הצליח הפעם</p>':''}</div>
  <div class="tl" style="margin-top:16px">${songRow(s,'new')}</div>
  ${ok?`<h2>הציר שלך</h2><div class="tl">${p.tl.map(x=>songRow(x,x===s?'new':'')).join('')}</div>`:''}
  <button class="big" onclick="${win?'finish()':'next()'}">${win?'לסיום':G.players.length>1?'התור הבא':'שיר הבא'}</button>`;
}
const ls={get(){try{return JSON.parse(localStorage.getItem('tzir_seen')||'[]')}catch(e){return[]}},set(a){try{localStorage.setItem('tzir_seen',JSON.stringify(a))}catch(e){}}};
function markSeen(id){const a=ls.get();if(!a.includes(id)){a.push(id);ls.set(a)}}
function swap(){G.players[G.cur].sw=1;turn(true)}
function bonus(s){
  const pool=PK[G.pack].filter(x=>x.a!==s.a);
  const opts=shuffle([s,...shuffle(pool).slice(0,3)]);
  $('#app').innerHTML=`<div class="center"><div class="res ok">צדקת! שאלת בונוס</div><p class="sub">מה השיר ומי המבצע? תשובה נכונה נותנת מגן מטעות עתידית.</p></div><div class="tl" style="margin-top:14px;gap:8px">${opts.map(o=>`<button style="text-align:start" onclick="ans(${o.id})"><b>${o.t}</b><small style="display:block;color:var(--mute)">${o.a}</small></button>`).join('')}</div><button class="big" style="background:transparent;color:var(--mute);border-color:var(--line)" onclick="ans(-1)">דלגו על הבונוס</button>`;
}
function ans(id){const p=G.players[G.cur];const bn=id===-1?null:id===G.song.id;if(bn)p.sh=(p.sh||0)+1;res(true,false,bn)}
function next(){G.cur=(G.cur+1)%G.players.length;G.players.length>1?pass():turn()}
function finish(){
  const p=G.players[G.cur],ys=p.tl.map(x=>x.y);
  $('#app').innerHTML=`<div class="center"><p class="sub">${G.players.length>1?'המנצח/ת':'הגעתם ליעד'}</p><div class="name" style="margin-top:6px">${p.n}</div>
  <p class="sub">${p.tl.length} שירים על הציר, מ־${Math.min(...ys)} עד ${Math.max(...ys)}</p></div>
  <div class="tl" style="margin-top:16px">${p.tl.map(x=>songRow(x)).join('')}</div>
  <button class="big" onclick="home()">משחק חדש</button>`;
}
function home(){
  stopAudio();
  $('#app').innerHTML=`<h1>ציר</h1><p class="sub">שומעים, מנחשים שנה, בונים ציר זמן מוזיקלי.</p>
  <h2>חבילת שירים</h2><div class="row">${[['intl','בינלאומית'],['isr','ישראלית'],['mix','מעורב']].map(([k,n])=>`<button class="pack ${G.pack==k?'on':''}" onclick="G.pack='${k}';home()">${n}</button>`).join('')}</div>${G.pack!='intl'?'<p class="note" style="text-align:start">החבילה הישראלית קטנה: 34 שירים, בעיקר מהאירוויזיון, ושנות היציאה אומתו.</p>':''}
  <h2>כמה שחקנים?</h2><div class="row">${[1,2,3,4].map(n=>`<button class="pack ${G.cnt==n?'on':''}" onclick="G.cnt=${n};syncNames();home()">${n}</button>`).join('')}</div>
  <h2>שמות</h2>${Array.from({length:G.cnt},(_,i)=>`<input id="n${i}" placeholder="שחקן ${i+1}" value="${G.names[i]}" maxlength="14" oninput="G.names[${i}]=this.value">`).join('')}
  <h2>יעד לניצחון</h2><div class="row">${[7,10,15].map(n=>`<button class="pack ${G.target==n?'on':''}" onclick="G.target=${n};home()">${n} שירים</button>`).join('')}</div>
  <p class="note" style="text-align:start">שירים ששוחקו לא חוזרים בערבים הבאים. <a href="#" onclick="ls.set([]);home();return false" style="color:var(--acc)">איפוס</a></p><div class="row" style="margin-top:18px;align-items:center"><button onclick="beep()">בדיקת שמע</button><span id="snd" class="sub" style="margin:0"></span></div>
  <button class="big" onclick="start()">יוצאים לדרך</button>`;
}
function syncNames(){}
home();
</script>
</body>
</html>
