@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1745;--bg2:#2c2570;--ink:#f3efff;--card:#2a2562;--mute:#a9a3dc;--acc:#ff5c96;--acc2:#ffc93c;--ok:#4fd49a;--bad:#ff7a6e;--line:#4a4390;--sh:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 55% at 50% 0,var(--bg2),var(--bg) 62%) no-repeat,var(--bg);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 36px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
p.sub{color:var(--mute);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:500;transition:transform .08s}
button:active:not(:disabled){transform:translateY(2px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
button.big{width:100%;background:var(--acc);border-color:var(--acc);color:#fff;font-size:20px;font-weight:800;padding:15px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
button.soft{border-color:var(--line);color:var(--mute);flex:1;font-size:14px;padding:10px 8px}
input{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px;margin-top:14px;box-shadow:var(--sh)}
.pack{flex:1;min-width:28%;text-align:center;line-height:1.25}
.pack small{display:block;font-size:11px;opacity:.7;font-weight:400}
.pack span{display:block;font-size:22px}
.hero{text-align:center;padding-top:6px}
.logo{width:92px;height:92px;border-radius:50%;margin:0 auto;background:radial-gradient(circle,var(--acc2) 0 17%,var(--bg) 18% 21%,transparent 22%),repeating-radial-gradient(circle,#15122f 0 2px,#262150 3px 4px);box-shadow:0 0 0 4px var(--acc);animation:sp 6s linear infinite}
.hero h1{font-size:60px;margin:10px 0 0;line-height:1;font-weight:800;letter-spacing:-1px}
.prow{display:flex;gap:10px;align-items:center;margin-top:8px}
.prow:first-of-type{margin-top:0}
.dot{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block}
.center{text-align:center}
.pass{text-align:center;padding-top:34px}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;background:var(--c);color:#fff;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.name{font-size:50px;font-weight:800;margin:6px 0 8px;line-height:1.1;color:var(--c,var(--acc))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .x{padding:6px 12px;border-color:var(--line);color:var(--mute);font-size:14px}
.who{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.cnt{font-weight:800;font-size:18px;min-width:64px;text-align:end}
.goal{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:var(--c,var(--acc));border-radius:4px;transition:width .4s}
.player{text-align:center}
.disc{width:112px;height:112px;border-radius:50%;margin:0 auto 6px;border:0;padding:0;font-size:34px;color:var(--ink);background:radial-gradient(circle,var(--acc2) 0 24%,transparent 25%),repeating-radial-gradient(circle,#15122f 0 2px,#262150 3px 4px);box-shadow:0 0 0 4px var(--acc),0 6px 0 4px rgba(0,0,0,.15);display:block}
.disc.spin{animation:sp 2s linear infinite;color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
#tm{font-size:13px;color:var(--mute)}
.tl{display:flex;flex-direction:column;align-items:stretch}
.slot{border:2px dashed var(--line);background:transparent;color:var(--mute);padding:10px;margin:5px 0;font-size:14px}
.slot.sel{border-style:solid;border-color:var(--acc);background:var(--acc);color:#fff;font-weight:800;animation:pop .25s}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-inline-start:8px solid hsl(var(--h,330) 65% 50%);border-radius:14px;padding:9px 12px;margin:2px 0}
.art{width:52px;height:52px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800;object-fit:cover}
.meta{min-width:0}.meta b{font-size:15px;display:block}.song small{color:var(--mute);display:block}
.yr{margin-inline-start:auto;font-size:24px;font-weight:800;color:var(--acc)}
.song.new{animation:pop .5s}
@keyframes pop{from{transform:scale(.92);opacity:.3}}
.dock{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 40%)}
.res{font-size:34px;font-weight:800;margin:10px 0 2px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.rev{display:flex;gap:14px;align-items:center;background:var(--card);border:3px solid var(--ok);border-radius:20px;padding:14px;margin-top:14px;animation:flip .6s;box-shadow:var(--sh)}
.rev.miss{border-color:var(--bad)}
.rev .art{width:88px;height:88px;font-size:36px}
.rev b{font-size:19px;display:block}.rev small{color:var(--mute)}
.ry{margin-inline-start:auto;font-size:44px;font-weight:800;color:var(--acc)}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
.opt{text-align:start;width:100%;margin-top:8px;padding:14px}
.opt small{display:block;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:14px;text-align:center}
.mock{background:var(--acc2);color:#1f1a4d;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500}
.cf{position:fixed;top:-14px;width:9px;height:15px;opacity:.95;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.trophy{font-size:72px;line-height:1;animation:pop .6s}
.sb{display:flex;align-items:center;gap:10px;margin-top:8px}.sb b{margin-inline-start:auto;font-size:20px}
.tvb{padding:6px 12px;border-color:var(--line);color:var(--mute);font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(10,8,40,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);border:2px solid var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:85vh;overflow:auto}
.sheet li{margin:8px 0;line-height:1.5}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:16px;right:16px;margin:auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:70;animation:in .3s;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:8px 12px;font-size:14px;border-radius:20px}
.tv-grid{display:block}
body.wide #app{max-width:none;padding:12px 24px 20px}
body.wide #app:not(:has(.tv-grid)):not(:has(.fin)){max-width:720px}
body.wide #app:has(.fin){max-width:1300px}
body.wide .tv-grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}
body.wide .disc{width:84px;height:84px}
body.wide .tl{flex-direction:row;overflow-x:auto;direction:ltr;align-items:stretch;gap:6px;padding:4px 2px 10px}
body.wide .tl>*{direction:rtl;flex:none}
body.wide .song{flex-direction:column;justify-content:center;text-align:center;width:150px;border-inline-start:2px solid var(--ink);border-top:8px solid hsl(var(--h,330) 65% 50%);padding:12px 8px;gap:6px}
body.wide .song .art{width:72px;height:72px}
body.wide .song .yr{margin:0;font-size:30px}
body.wide .slot{width:86px;margin:0;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
body.wide .dock{position:static}
body.wide h2{margin-top:0}
.code{font-size:60px;font-weight:800;letter-spacing:10px;direction:ltr;color:var(--acc);margin:2px 0}
.chipsc{display:flex;gap:8px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:6px;padding:6px 10px;border:2px solid var(--line);border-radius:14px;font-size:14px}
.pl.cur{border-color:var(--acc);background:var(--card);font-weight:800}.pl.off{opacity:.5}
.slot:disabled.sel{opacity:1}
div.disc{cursor:default}
body.wide #app:has(.fin) .tl{flex-wrap:wrap;direction:rtl;justify-content:center;overflow:visible}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}

function mpMenu(){scrollTo(0,0);$('#app').innerHTML=`<div class="center"><h2 style="font-size:26px">📡 משחק בכמה מכשירים</h2><p class="sub">מארח אחד מציג מסך משותף לכולם, וכל שחקן מצטרף מהטלפון שלו עם קוד ורואה את הציר שלו.</p></div>
<div class="card"><button class="big" style="margin-top:0" onclick="mpHostStart()">🖥️ פתיחת חדר (אני המארח)</button><p class="note" style="margin:10px 0 0">החבילה, הסגנון, היעד והבונוסים נלקחים ממסך הפתיחה.</p></div>
<div class="card"><h2>הצטרפות לחדר</h2><input id="mc" placeholder="קוד חדר" maxlength="4" style="text-transform:uppercase;direction:ltr;text-align:center;font-size:24px"><input id="mn" placeholder="השם שלך" maxlength="14" style="margin-top:8px" value="${G.names[0]||''}"><button class="big" onclick="mpJoin($('#mc').value,$('#mn').value)">הצטרפות</button></div>
<button class="soft" style="width:100%;margin-top:14px;padding:12px" onclick="home()">חזרה למשחק הרגיל</button>`}
async function mpHostStart(){$('#app').innerHTML='<p class="center sub" style="padding-top:60px">מתחברים...</p>';
 try{await loadPeer()}catch(e){return mpErr('לא הצלחנו לטעון את שירות החיבור. בדקו אינטרנט.')}
 MP.host=true;MP.me='host';
 const go=()=>{MP.code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');const p=new Peer('tzirgame-'+MP.code);MP.peer=p;
  p.on('open',()=>{MP.S={phase:'lobby',players:[],cur:0,target:G.target,bon:G.bon,audioAt:MP.o.audioAt,slot:null};mpSyncHost();bcast()});
  p.on('connection',c=>{c.on('data',m=>hostMsg(c.peer,m,c));c.on('close',()=>hostDrop(c.peer))});
  p.on('error',e=>{if(e.type==='unavailable-id')go();else mpErr('שגיאת חיבור: '+e.type)})};go()}
function mpSyncHost(){const S=MP.S,i=S.players.findIndex(p=>p.id==='host');if(MP.o.play&&i<0)S.players.unshift({id:'host',n:MP.o.name||'מארח',tl:[],sh:0,st:0,sw:0,tot:0,hit:0,on:true});else if(!MP.o.play&&i>=0)S.players.splice(i,1);else if(i>=0)S.players[i].n=MP.o.name||'מארח'}
function mpOpt(k,v){MP.o[k]=v;if(k==='audioAt')MP.S.audioAt=v;mpSyncHost();bcast()}
function mpShare(){const u=location.origin+location.pathname+'?room='+MP.code;if(navigator.share)navigator.share({title:'ניחושיר',text:'הצטרפו למשחק, קוד '+MP.code,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast('הקישור הועתק')}catch(e){toast(u)}}}
function hostDrop(id){const S=MP.S;if(!S)return;const i=S.players.findIndex(p=>p.id===id);if(i<0)return;if(S.phase==='lobby')S.players.splice(i,1);else S.players[i].on=false;delete MP.conns[id];bcast()}
function mpSend(m){Object.values(MP.conns).forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function bcast(){mpSend({t:'S',S:MP.S});mpRender()}
function hostMsg(from,m,c){const S=MP.S,H=MP.H;if(!S)return;
 if(m.t==='join'){let n=String(m.n||'שחקן').trim().slice(0,14)||'שחקן';const ex=S.players.find(p=>p.id!=='host'&&p.n===n&&p.on===false);
  if(ex){ex.id=from;ex.on=true}else if(S.phase==='lobby'){let k=n,i=2;while(S.players.some(p=>p.n===k))k=n+' '+i++;S.players.push({id:from,n:k,tl:[],sh:0,st:0,sw:0,tot:0,hit:0,on:true})}else{c&&c.send({t:'full'});return}
  if(c)MP.conns[from]=c;bcast();return}
 const cur=S.players[S.cur];
 if(m.t==='next'){if(cur&&(from==='host'||cur.id===from))mpNext();return}
 if(S.phase==='lobby'||!cur||cur.id!==from)return;
 if(m.t==='play'){if(from!=='host'&&S.phase==='turn')preview(H.song).then(p=>playUrl(p&&p.u,H.song.id))}
 else if(m.t==='slot'&&S.phase==='turn'){S.slot=m.i;mpSend({t:'slot',i:m.i});mpSlotUI()}
 else if(m.t==='skip'&&S.phase==='turn'){nextSong();bcast()}
 else if(m.t==='swap'&&S.phase==='turn'&&!cur.sw){cur.sw=1;nextSong();bcast()}
 else if(m.t==='confirm'&&S.phase==='turn'&&m.i!=null)mpConfirm(m.i);
 else if(m.t==='yr'&&S.phase==='bonusY')mpYear(m.g);
 else if(m.t==='ysk'&&S.phase==='bonusY')mpOpts();
 else if(m.t==='ans'&&S.phase==='bonusS')mpAnswer(m.id)}
function mpStartGame(){mpUnlock();const S=MP.S,H=MP.H;mpSyncHost();const seen=ls.get(),base=pk();let pool=base.filter(x=>!seen.includes(x.id)&&!NA.has(x.id));
 if(pool.length<S.players.length*(G.target+2)){ls.set(seen.filter(id=>!base.some(x=>x.id===id)));pool=base.filter(x=>!NA.has(x.id))}
 H.deck=shuffle(pool);H.ch=0;S.target=G.target;S.bon=G.bon;S.audioAt=MP.o.audioAt;S.win=false;
 S.players.forEach(p=>{p.tl=[slim(H.deck.pop())];markSeen(p.tl[0].id);p.sh=0;p.st=0;p.sw=0;p.tot=0;p.hit=0});
 S.cur=0;S.phase='turn';nextSong();bcast();keepAwake()}
function nextSong(){const S=MP.S,H=MP.H;let n=0;do{if(!H.deck.length)H.deck=shuffle(pk());H.song=H.deck.pop()}while(NA.has(H.song.id)&&++n<30);S.slot=null;S.opts=null;S.nb=null;S.reveal=null;const sg=H.song;
 preview(sg).then(p=>{if(NA.has(sg.id)&&H.song===sg&&S.phase==='turn'&&(H.ch=(H.ch||0)+1)<6){nextSong();bcast();return}
  if(S.audioAt==='turn'&&H.song===sg){const a=S.players[S.cur],c=a&&MP.conns[a.id];if(c)c.send({t:'clip',u:p?p.u:null,id:sg.id})}})}
function mpConfirm(i){const S=MP.S,H=MP.H,p=S.players[S.cur],s=H.song;stopAudio();markSeen(s.id);
 const prev=i>0?p.tl[i-1].y:-Infinity,next=i<p.tl.length?p.tl[i].y:Infinity;
 let ok=prev<=s.y&&s.y<=next,saved=false;
 if(!ok&&p.sh>0){p.sh--;saved=true;ok=true;i=p.tl.filter(x=>x.y<=s.y).length}
 H.r={ok,saved,bn:null,ym:null,pos:i};
 if(ok&&!saved&&S.bon){S.phase='bonusY';S.nb=[prev===-Infinity?null:prev,next===Infinity?null:next];bcast()}else mpReveal()}
function mpYear(g){const S=MP.S,H=MP.H,p=S.players[S.cur],d=Math.abs(g-H.song.y),pts=d==0?2:d<=2?1:0;p.st=(p.st||0)+pts;let sh=0;while(p.st>=3){p.st-=3;p.sh++;sh++}H.r.ym={g,pts,sh};mpOpts()}
function mpOpts(){const S=MP.S,s=MP.H.song,pool=PK[G.pack].filter(x=>x.a!==s.a);S.opts=shuffle([s,...shuffle(pool).slice(0,3)]).map(x=>({id:x.id,t:x.t,a:x.a}));S.phase='bonusS';bcast()}
function mpAnswer(id){const S=MP.S,H=MP.H,p=S.players[S.cur];H.r.bn=id===-1?null:id===H.song.id;if(H.r.bn)p.sh++;mpReveal()}
function mpReveal(){const S=MP.S,H=MP.H,p=S.players[S.cur],r=H.r;if(r.ok)p.tl.splice(r.pos,0,slim(H.song));p.tot++;if(r.ok&&!r.saved)p.hit++;S.reveal={song:slim(H.song),ok:r.ok,saved:r.saved,bn:r.bn,ym:r.ym};S.win=r.ok&&p.tl.length>=S.target;S.phase='reveal';bcast()}
function mpNext(){const S=MP.S,H=MP.H;if(S.phase==='reveal'&&S.win){S.phase='end';return bcast()}
 if(S.phase!=='reveal'&&S.phase!=='turn')return;H.ch=0;S.cur=(S.cur+1)%S.players.length;S.phase='turn';nextSong();bcast()}
function mpAgain(){const S=MP.S;S.players.forEach(p=>{p.tl=[];p.sh=0;p.st=0;p.sw=0;p.tot=0;p.hit=0});S.phase='lobby';S.win=false;bcast()}
/* client */
async function mpJoin(code,name){code=(code||'').trim().toUpperCase();name=(name||'').trim();if(code.length<4||!name)return toast('נא למלא קוד ושם');G.names[0]=name;
 $('#app').innerHTML='<p class="center sub" style="padding-top:60px">מתחברים...</p>';
 try{await loadPeer()}catch(e){return mpErr('לא הצלחנו לטעון את שירות החיבור. בדקו אינטרנט.')}
 MP.host=false;const p=new Peer();MP.peer=p;
 p.on('open',id=>{MP.me=id;const c=p.connect('tzirgame-'+code,{reliable:true});MP.conn=c;
  c.on('open',()=>{c.send({t:'join',n:name});MP.code=code;keepAwake()});
  c.on('data',clientMsg);c.on('close',()=>mpErr('החיבור למארח נותק'));
  setTimeout(()=>{if(!MP.S)mpErr('לא הצלחנו להתחבר. בדקו את הקוד והרשת')},9000)});
 p.on('error',e=>mpErr(e.type==='peer-unavailable'?'לא נמצא חדר עם הקוד הזה':'שגיאת חיבור: '+e.type))}
function clientMsg(m){if(m.t==='S'){MP.S=m.S;mpRender()}else if(m.t==='slot'){MP.S.slot=m.i;mpSlotUI()}else if(m.t==='clip')MP.clip=m;else if(m.t==='full')mpErr('המשחק כבר התחיל')}
function mpAct(t,d){d=Object.assign({t},d||{});if(MP.host)hostMsg('host',d,null);else if(MP.conn)MP.conn.send(d)}
/* actions from the UI */
function mpPick(i){MP.S.slot=i;mpSlotUI();mpAct('slot',{i});vib(12)}
function mpSlotUI(){const S=MP.S;document.querySelectorAll('.slot').forEach(e=>e.classList.remove('sel'));const e=$('#s'+S.slot);if(e)e.classList.add('sel');const b=$('#ok');if(b)b.disabled=S.slot==null}
function mpConfirmUI(){if(MP.S.slot!=null)mpAct('confirm',{i:MP.S.slot})}
function mpPlay(){const S=MP.S;if(MP.host){const sg=MP.H.song;preview(sg).then(p=>playUrl(p&&p.u,sg.id));return}
 if(S.audioAt==='turn'){const c=MP.clip;if(!c)return toast('השיר נטען, נסו שוב');playUrl(c.u,c.id)}else{mpAct('play');toast('השיר מתנגן במסך המשותף')}}
function mpYAdj(k){MP.yg=Math.max(1940,Math.min(2030,MP.yg+k));$('#yg').textContent=MP.yg;vib(8)}
/* views */
const plOf=()=>MP.S.players.find(p=>p.id===MP.me);
function scoreHtml(){const S=MP.S;return `<div class="chipsc">${S.players.map((p,i)=>`<span class="pl ${i==S.cur&&S.phase!=='lobby'?'cur':''} ${p.on===false?'off':''}"><i class="dot" style="background:${COLS[i%4]}"></i>${p.n}${S.phase==='lobby'?'':' · '+p.tl.length+'/'+S.target}${p.st?' '+'⭐'.repeat(p.st):''}${p.sh?' '+'🛡️'.repeat(p.sh):''}</span>`).join('')||'<span class="sub">עדיין אין שחקנים</span>'}</div>`}
function tlHtml(p,mode){let t='';for(let i=0;i<=p.tl.length;i++){if(mode)t+=`<button class="slot ${MP.S.slot===i?'sel':''}" id="s${i}" ${mode==2?`onclick="mpPick(${i})"`:'disabled'}>＋ ${lab(i,p)}</button>`;if(i<p.tl.length)t+=songRow(p.tl[i])}return t}
const ctrlCard=cur=>`<div class="card player"><button class="disc" aria-label="נגן את השיר" onclick="mpPlay()">▶</button><div class="prog"><i></i></div><div id="tm">0:00 / 0:30</div><div class="row" style="margin-top:10px"><button class="soft" onclick="mpPlay()">↻ שמעו שוב</button><button class="soft" onclick="mpAct('skip')">לא מתנגן? שיר אחר</button><button class="soft" style="flex-basis:100%" ${cur.sw?'disabled':''} onclick="mpAct('swap')">לא מכירים? החלפה (פעם אחת)</button></div><p class="note" style="margin:8px 0 0"><span class="mock" id="mock" style="display:none">מתנגנת מנגינה בדויה</span></p></div>`;
const discCard=cur=>`<div class="card player"><div class="disc">▶</div><div class="prog"><i></i></div><div id="tm">0:00 / 0:30</div><p class="note" style="margin:8px 0 0">${MP.S.audioAt==='host'?'השמע מתנגן כאן כשהשחקן לוחץ':'השמע מתנגן אצל '+cur.n}<span class="mock" id="mock" style="display:none"> · מנגינה בדויה</span></p></div>`;
const dockBtn=(label,fn,dis)=>`<div class="dock"><button class="big" id="ok" ${dis||''} onclick="${fn}">${label}</button></div>`;
const yearUI=()=>`<div class="center"><div class="res ok">✓ צדקת!</div><p class="sub"><b>בונוס שנה:</b> באיזו שנה יצא השיר?<br>פער של עד שנתיים = ⭐ · בול = ⭐⭐ · שלושה כוכבים = 🛡️</p></div><div class="card center"><div class="ry" id="yg" style="margin:0;font-size:60px">${MP.yg}</div><div class="row" style="justify-content:center;margin-top:10px">${[-5,-1,1,5].map(k=>`<button class="soft" style="flex:none;min-width:68px;font-size:18px" onclick="mpYAdj(${k})">${k>0?'+':'−'}${Math.abs(k)}</button>`).join('')}</div></div><div class="dock"><button class="big" onclick="mpAct('yr',{g:MP.yg})">אישור שנה</button><button class="soft" style="width:100%;margin-top:8px;padding:12px" onclick="mpAct('ysk')">דלגו</button></div>`;
const optsUI=()=>`<div class="center"><div class="res ok">✓ צדקת!</div><p class="sub"><b>בונוס שיר:</b> מה השיר ומי המבצע?</p></div>${MP.S.opts.map(o=>`<button class="opt" onclick="mpAct('ans',{id:${o.id}})"><b>${o.t}</b><small>${o.a}</small></button>`).join('')}<button class="soft" style="width:100%;margin-top:14px;padding:12px" onclick="mpAct('ans',{id:-1})">דלגו על הבונוס</button>`;
function revHtml(){const r=MP.S.reveal,s=r.song;return `<div class="center"><div class="res ${r.ok?'ok':'bad'}">${r.saved?'🛡️ כמעט!':r.ok?'✓ צדקת!':'✗ לא הפעם'}</div><p class="sub">${r.saved?'המגן הציל אותך':r.ok?'השיר נשאר על הציר':'השיר יצא מהמשחק'}</p>${r.bn===true?'<p class="sub">🛡️ בונוס שיר נכון</p>':r.bn===false?'<p class="sub">הבונוס לא הצליח</p>':''}${r.ym?`<p class="sub">📅 ניחוש ${r.ym.g}: ${r.ym.pts?'⭐'.repeat(r.ym.pts):'בלי כוכב'}${r.ym.sh?' · 🛡️ מגן!':''}</p>`:''}</div><div class="rev ${r.ok?'':'miss'}">${art(s)}<div class="meta"><b>${s.t}</b><small>${s.a}</small></div><div class="ry" id="ry">${s.y}</div></div>`}
const nextBtn=()=>`<div class="dock"><button class="big" onclick="mpAct('next')">${MP.S.win?'לסיום 🏆':'התור הבא'}</button></div>`;
const waitTxt=(cur,t)=>`<div class="center"><div class="res" style="font-size:26px">${cur.n} ${t}</div><p class="sub">ממתינים...</p></div>`;
function topBar(p,i){const S=MP.S,c=COLS[i%4];return `<div style="--c:${c}"><div class="top"><button class="x" onclick="mpQuit()">✕ יציאה</button><div class="who"><i class="dot" style="background:${c}"></i>${p.n}${p.on===false?' (מנותק)':''}</div><div class="cnt">${p.tl.length}/${S.target}</div></div><div class="goal"><i style="width:${Math.min(100,p.tl.length/S.target*100)}%"></i></div></div>`}
function lobbyHost(){const S=MP.S,url=location.origin+location.pathname+'?room='+MP.code;
 return `<div class="center"><p class="sub">קוד החדר</p><div class="code">${MP.code}</div><p class="sub" style="font-size:12px;direction:ltr;word-break:break-all">${url}</p><img alt="" width="150" height="150" style="border-radius:12px;margin-top:8px;background:#fff;padding:6px" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" onerror="this.remove()"><div class="row" style="justify-content:center;margin-top:10px"><button class="soft" style="flex:none" onclick="mpShare()">שיתוף קישור</button></div></div>

 <div class="row"><button class="pack ${MP.o.play?'on':''}" onclick="mpOpt('play',true)">אני משתתף<small>המארח משחק גם</small></button><button class="pack ${MP.o.play?'':'on'}" onclick="mpOpt('play',false)">רק מסך<small>מארח בלי לשחק</small></button></div>

const lobbyClient=()=>`<div class="center" style="padding-top:20px"><p class="sub">חדר</p><div class="code">${MP.code}</div><p class="sub">מחכים שהמארח יתחיל את המשחק</p></div><div class="card"><h2>שחקנים בחדר</h2>${scoreHtml()}</div><button class="soft" style="width:100%;margin-top:14px;padding:12px" onclick="mpLeave()">יציאה</button>`;
function sharedView(mine){const S=MP.S,cur=S.players[S.cur];
 const L=topBar(cur,S.cur)+(S.phase==='turn'?(mine?ctrlCard(cur):discCard(cur)):'')+`<div class="card">${scoreHtml()}</div>`;let R='';

 else if(S.phase==='bonusY')R=(mine?yearUI():waitTxt(cur,'מנחש/ת שנה'))+`<div class="tl">${tlHtml(cur,0)}</div>`;

 else if(S.phase==='reveal')R=revHtml()+`<h2 style="margin-top:14px">הציר של ${cur.n}</h2><div class="tl">${tlHtml(cur,0)}</div>`+nextBtn();
 return `<div class="tv-grid"><div class="tv-l">${L}</div><div class="tv-r">${R}</div></div>`}

 else if(S.phase==='bonusY')b+=yearUI();else if(S.phase==='bonusS')b+=optsUI();

 const st=S.phase==='turn'?'מנחש/ת עכשיו':S.phase==='bonusY'?'בבונוס שנה':S.phase==='bonusS'?'בבונוס שיר':'';
 return topBar(me,mi)+`<div class="card center"><div class="who" style="justify-content:center"><i class="dot" style="background:${COLS[S.cur%4]}"></i>תור של ${cur.n}</div><p class="sub">${st}</p></div>`+(S.phase==='reveal'?revHtml():'')+`<h2 style="margin-top:14px">הציר שלך</h2><div class="tl">${tlHtml(me,0)}</div><div class="card">${scoreHtml()}</div>`}
function endView(){const S=MP.S,w=S.players[S.cur];return `<i class="fin"></i><div class="center" style="--c:${COLS[S.cur%4]}"><div class="trophy">🏆</div><p class="sub">המנצח/ת</p><div class="name">${w.n}</div><p class="sub">${w.tl.length} שירים</p></div><div class="card">${S.players.slice().sort((a,b)=>b.tl.length-a.tl.length).map(q=>`<div class="sb"><i class="dot" style="background:${COLS[S.players.indexOf(q)%4]}"></i>${q.n}<b>${q.tl.length}</b></div>`).join('')}</div><h2 style="margin-top:14px">הציר המלא של ${w.n}</h2><div class="tl">${tlHtml(w,0)}</div>`+(MP.host?`<div class="dock"><button class="big" onclick="mpAgain()">משחק חדש באותו חדר</button><button class="soft" style="width:100%;margin-top:8px;padding:12px" onclick="mpLeave()">סגירת החדר</button></div>`:'<p class="note">ממתינים למארח...</p>')}
function mpRender(){const S=MP.S;if(!S)return;const cur=S.players[S.cur],mine=!!cur&&cur.id===MP.me;let h;
 if(S.phase==='lobby')h=MP.host?lobbyHost():lobbyClient();else if(S.phase==='end')h=endView();else h=MP.host?sharedView(mine):(mine?ctrlView():specView());
 if(S.phase!==MP.ph||S.cur!==MP.cu){if(S.phase!=='turn'||S.cur!==MP.cu)stopAudio();
  if(S.phase==='bonusY'&&S.nb){const[a,b]=S.nb;MP.yg=a!=null&&b!=null?Math.round((a+b)/2):(a!=null?a:b!=null?b:2000)}}
 const ch=S.phase!==MP.ph;MP.ph=S.phase;MP.cu=S.cur;scrollTo(0,0);$('#app').innerHTML=h;
 if(ch){if(S.phase==='reveal'){const r=S.reveal;if(MP.host){sfx(r.ok?'ok':'bad');if(r.ok)confetti(S.win?90:26)}vib(r.ok?[30,40,30]:[140]);countUp('ry',r.song.y)}
  else if(S.phase==='end'){if(MP.host){sfx('win');confetti(120)}vib([40,60,40,60,120])}else if(S.phase==='turn')vib(20)}}
fit();home();{const q=new URLSearchParams(location.search).get('room');if(q){mpMenu();$('#mc').value=q.toUpperCase().slice(0,4)}}
</script>
