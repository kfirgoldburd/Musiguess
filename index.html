<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ציר – משחק הזמן המוזיקלי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeaff;--ink:#1f1a4d;--card:#fffdf8;--mute:#6a6595;--acc:#d6306f;--acc2:#f2b01e;--ok:#16895a;--bad:#c8372d;--line:#c9c1ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1745;--ink:#f3efff;--card:#2a2562;--mute:#a9a3dc;--acc:#ff5c96;--acc2:#ffc93c;--ok:#4fd49a;--bad:#ff7a6e;--line:#4a4390;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:64px;font-weight:800;margin:10px 0 0;letter-spacing:-1px;line-height:1}
h2{font-size:22px;margin:22px 0 10px;font-weight:800}
p.sub{color:var(--mute);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:500}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}
button.big{width:100%;background:var(--acc);border-color:var(--acc);color:#fff;font-size:20px;font-weight:800;padding:16px;margin-top:18px}
button.big:disabled{opacity:.4;cursor:default}
button.soft{border-color:var(--line);color:var(--mute);flex:1}
button:disabled{opacity:.45}
input{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.pack{flex:1;min-width:30%;text-align:center}
.center{text-align:center}
.name{font-size:54px;font-weight:800;margin:40px 0 8px;line-height:1.1;color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:500;color:var(--mute)}
.bar b{color:var(--ink);font-size:26px;font-weight:800}
.player{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;margin-top:12px;text-align:center}
.disc{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;border:0;padding:0;font-size:34px;color:#fff;background:radial-gradient(circle,var(--acc2) 0 14%,#111 15% 100%);box-shadow:0 0 0 4px var(--acc);position:relative}
.disc.spin{animation:sp 2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc.spin{animation:none}}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.tl{margin-top:14px;display:flex;flex-direction:column;align-items:stretch}
.slot{border:2px dashed var(--line);background:transparent;color:var(--mute);padding:9px;margin:5px 0;font-size:14px}
.slot.sel{border-style:solid;border-color:var(--acc);background:var(--acc);color:#fff;font-weight:800}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:2px 0;position:relative}
.song:before{content:"";position:absolute;inset-inline-start:-0px}
.art{width:52px;height:52px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:800}
.song small{color:var(--mute);display:block}
.song b{font-size:15px}
.yr{margin-inline-start:auto;font-size:24px;font-weight:800;color:var(--acc)}
.song.new{animation:pop .5s}
@keyframes pop{from{transform:scale(.9);opacity:.3}}
.res{font-size:30px;font-weight:800;margin:14px 0 4px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.note{font-size:13px;color:var(--mute);margin-top:16px;text-align:center}
.mock{background:var(--acc2);color:#1f1a4d;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW=`Hey Jude|The Beatles|1968
Satisfaction|The Rolling Stones|1965
Respect|Aretha Franklin|1967
Like a Rolling Stone|Bob Dylan|1965
Good Vibrations|The Beach Boys|1966
My Girl|The Temptations|1964
Space Oddity|David Bowie|1969
Purple Haze|Jimi Hendrix|1967
Bohemian Rhapsody|Queen|1975
Hotel California|Eagles|1976
Stayin’ Alive|Bee Gees|1977
Imagine|John Lennon|1971
Dancing Queen|ABBA|1976
Stairway to Heaven|Led Zeppelin|1971
I Will Survive|Gloria Gaynor|1978
Smoke on the Water|Deep Purple|1972
Superstition|Stevie Wonder|1972
Let It Be|The Beatles|1970
Don’t Stop Me Now|Queen|1979
Another Brick in the Wall|Pink Floyd|1979
Billie Jean|Michael Jackson|1982
Thriller|Michael Jackson|1982
Like a Virgin|Madonna|1984
Every Breath You Take|The Police|1983
Sweet Child o’ Mine|Guns N’ Roses|1987
Take On Me|a-ha|1985
Girls Just Want to Have Fun|Cyndi Lauper|1983
Livin’ on a Prayer|Bon Jovi|1986
With or Without You|U2|1987
Purple Rain|Prince|1984
Africa|Toto|1982
Don’t Stop Believin’|Journey|1981
Never Gonna Give You Up|Rick Astley|1987
Wake Me Up Before You Go-Go|Wham!|1984
Smells Like Teen Spirit|Nirvana|1991
Wonderwall|Oasis|1995
…Baby One More Time|Britney Spears|1998
Losing My Religion|R.E.M.|1991
I Will Always Love You|Whitney Houston|1992
Wannabe|Spice Girls|1996
Creep|Radiohead|1992
My Heart Will Go On|Celine Dion|1997
No Scrubs|TLC|1999
Gangsta’s Paradise|Coolio|1995
Zombie|The Cranberries|1994
Barbie Girl|Aqua|1997
Crazy in Love|Beyoncé|2003
Lose Yourself|Eminem|2002
Hey Ya!|OutKast|2003
Yellow|Coldplay|2000
Hips Don’t Lie|Shakira|2006
Umbrella|Rihanna|2007
Toxic|Britney Spears|2003
In da Club|50 Cent|2003
Seven Nation Army|The White Stripes|2003
Clocks|Coldplay|2002
Poker Face|Lady Gaga|2008
Single Ladies|Beyoncé|2008
Use Somebody|Kings of Leon|2008
Rolling in the Deep|Adele|2010
Somebody That I Used to Know|Gotye|2011
Call Me Maybe|Carly Rae Jepsen|2011
Gangnam Style|Psy|2012
Happy|Pharrell Williams|2013
Get Lucky|Daft Punk|2013
Royals|Lorde|2013
Uptown Funk|Mark Ronson ft. Bruno Mars|2014
Shake It Off|Taylor Swift|2014
Thinking Out Loud|Ed Sheeran|2014
Shape of You|Ed Sheeran|2017
Despacito|Luis Fonsi|2017
Blinding Lights|The Weeknd|2019
Old Town Road|Lil Nas X|2019
Bad Guy|Billie Eilish|2019
Levitating|Dua Lipa|2020
Good 4 U|Olivia Rodrigo|2021
Anti-Hero|Taylor Swift|2022
As It Was|Harry Styles|2022
Flowers|Miley Cyrus|2023`;
const ISRAW=`ירושלים של זהב|שולי נתן|1967|Yerushalayim Shel Zahav Shuli Natan
שיר לשלום|להקת הנח״ל|1969|Shir Lashalom Nahal Band
אי שם|אילנית|1973|Ilanit Ey Sham
א-בא-ני-בי|יזהר כהן ואלפא-בטא|1978|Izhar Cohen A-Ba-Ni-Bi
הללויה|מילק אנד האני|1979|Milk and Honey Hallelujah
חי|עפרה חזה|1983|Ofra Haza Hai
אים נין אלו|עפרה חזה|1984|Ofra Haza Im Nin Alu
דיווה|דנה אינטרנשיונל|1998|Dana International Diva
שירת הסטיקר|הדג נחש|2004|Hadag Nahash Shirat Hasticker
השקט שנשאר|שירי מימון|2005|Shiri Maimon Hasheket Shenish'ar
Push the Button|טיפקס|2007|Teapacks Push the Button
The Fire in Your Eyes|בועז מעודה|2008|Boaz Mauda The Fire in Your Eyes
מילים|הראל סקעת|2010|Harel Skaat Milim
Made of Stars|הובי סטאר|2016|Hovi Star Made of Stars
I Feel Alive|אימרי זיו|2017|Imri Ziv I Feel Alive
Toy|נטע|2018|Netta Toy
Home|קובי מרימי|2019|Kobi Marimi Home
Set Me Free|עדן אלנה|2021|Eden Alene Set Me Free
I.M|מייקל בן דוד|2022|Michael Ben David I.M
Unicorn|נועה קירל|2023|Noa Kirel Unicorn
Hurricane|עדן גולן|2024|Eden Golan Hurricane`;
const mk=(raw,o)=>raw.split("\n").map((l,i)=>{const[t,a,y,q]=l.split("|");return{id:o+i,t,a,y:+y,q}});
const PK={intl:mk(RAW,0),isr:mk(ISRAW,1000)};PK.mix=[...PK.intl,...PK.isr];
const AC={};let au,tok=0;
const $=s=>document.querySelector(s);
const hue=s=>(s.y*7+s.t.length*29)%360;
const art=s=>AC[s.id]&&AC[s.id].art?`<img class="art" src="${AC[s.id].art}" alt="" style="object-fit:cover">`:`<div class="art" style="background:linear-gradient(135deg,hsl(${hue(s)} 65% 45%),hsl(${(hue(s)+60)%360} 70% 35%))">${s.t[0]}</div>`;
const songRow=(s,cls="")=>`<div class="song ${cls}">${art(s)}<div><b>${s.t}</b><small>${s.a}</small></div><div class="yr">${s.y}</div></div>`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- mock audio (replaced by real 30s previews in phase 2) ---------- */
let ac,nodes=[],raf,t0=0;
function stopAudio(){if(au){au.pause();au=null}nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[];cancelAnimationFrame(raf);const d=$('.disc');if(d)d.classList.remove('spin');const p=$('.prog i');if(p)p.style.width='0'}
function playMock(song){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  stopAudio();
  let seed=song.id*9301+49297;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  const sc=[0,2,4,7,9],base=196*2**((song.id%7)/12),now=ac.currentTime;
  for(let i=0;i<60;i++){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.value=base*2**((sc[r()*5|0]+(r()<.3?12:0))/12);
    const s=now+i*.5;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.03);g.gain.exponentialRampToValueAtTime(.001,s+.45);
    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+.5);nodes.push(o);
  }
  t0=performance.now();$('.disc').classList.add('spin');
  const tick=()=>{const k=Math.min((performance.now()-t0)/30000,1);const p=$('.prog i');if(p)p.style.width=k*100+'%';if(k<1)raf=requestAnimationFrame(tick);else stopAudio()};tick();
}
async function preview(s){if(AC[s.id]!==undefined)return AC[s.id];let r=null;try{const c=new AbortController();setTimeout(()=>c.abort(),3500);const j=await(await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(s.q||s.t+' '+s.a),{signal:c.signal})).json();const x=j.results[0];if(x&&x.previewUrl)r={u:x.previewUrl,art:(x.artworkUrl100||'').replace('100x100','300x300')}}catch(e){}AC[s.id]=r;return r}
function prog30(){const k=Math.min((performance.now()-t0)/30000,1);const p=$('.prog i');if(p)p.style.width=k*100+'%';if(k<1)raf=requestAnimationFrame(prog30)}
async function playSong(s){stopAudio();const my=++tok,tag=$('#mock');const p=await preview(s);if(my!==tok)return;if(p){try{au=new Audio(p.u);await au.play();tag.style.display='none';$('.disc').classList.add('spin');t0=performance.now();prog30();au.onended=stopAudio;return}catch(e){au=null}}tag.style.display='';playMock(s)}
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=523;g.gain.value=.15;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4);$('#snd').textContent='✓ השמע עובד'}catch(e){$('#snd').textContent='השמע לא זמין במכשיר'}}

/* ---------- game state ---------- */
let G={cnt:2,target:10,pack:"intl",names:["","","",""]};
function start(){
  const deck=shuffle(PK[G.pack]);
  G.players=Array.from({length:G.cnt},(_,i)=>({n:G.names[i].trim()||'שחקן '+(i+1),tl:[deck.pop()]}));
  G.deck=deck;G.cur=0;G.slot=null;G.song=null;
  G.cnt===1?turn():pass();
}
function pass(){
  stopAudio();const p=G.players[G.cur];
  $('#app').innerHTML=`<div class="center"><p class="sub">העבירו את הטלפון אל</p><div class="name">${p.n}</div><p class="sub">${p.tl.length} מתוך ${G.target} שירים על הציר</p><button class="big" onclick="turn()">אני מוכן</button></div>`;
}
function turn(fresh=true){
  if(fresh||!G.song){if(!G.deck.length)G.deck=shuffle(PK[G.pack]);G.song=G.deck.pop();G.slot=null;preview(G.song);}
  const p=G.players[G.cur];
  let tl='';for(let i=0;i<=p.tl.length;i++){tl+=`<button class="slot ${G.slot===i?'sel':''}" onclick="pick(${i})">${i==0?'לפני השיר הראשון':i==p.tl.length?'אחרי השיר האחרון':'בין השניים'}</button>`;if(i<p.tl.length)tl+=songRow(p.tl[i]);}
  $('#app').innerHTML=`<div class="bar"><span>התור של</span><span><b>${p.n}</b></span><span>${p.tl.length}/${G.target}</span></div>
  <div class="player"><button class="disc" aria-label="נגן" onclick="playSong(G.song)">▶</button><div class="prog"><i></i></div>
  <div class="row"><button class="soft" onclick="turn(true)">דלגו לשיר אחר</button><button class="soft" onclick="playSong(G.song)">נסו שוב</button></div>
  <p class="note" style="margin:10px 0 0"><span class="mock" id="mock" style="display:none">השמע האמיתי לא זמין כאן, מתנגנת מנגינה בדויה</span></p></div>
  <h2>איפה השיר על הציר?</h2><div class="tl">${tl}</div>
  <button class="big" ${G.slot===null?'disabled':''} onclick="confirmPlace()">אישור</button>`;
}
function pick(i){G.slot=i;const y=scrollY;turn(false);scrollTo(0,y)}
function confirmPlace(){
  stopAudio();const p=G.players[G.cur],s=G.song,i=G.slot;
  const prev=i>0?p.tl[i-1].y:-Infinity,next=i<p.tl.length?p.tl[i].y:Infinity;
  const ok=prev<=s.y&&s.y<=next;
  if(ok)p.tl.splice(i,0,s);
  const win=ok&&p.tl.length>=G.target;
  $('#app').innerHTML=`<div class="center"><div class="res ${ok?'ok':'bad'}">${ok?'צדקת!':'לא הפעם'}</div>
  <p class="sub">${ok?'השיר נשאר על הציר שלך':'השיר יצא מהמשחק'}</p></div>
  <div class="tl" style="margin-top:16px">${songRow(s,'new')}</div>
  ${ok?`<h2>הציר שלך</h2><div class="tl">${p.tl.map(x=>songRow(x,x===s?'new':'')).join('')}</div>`:''}
  <button class="big" onclick="${win?'finish()':'next()'}">${win?'לסיום':G.players.length>1?'התור הבא':'שיר הבא'}</button>`;
}
function next(){G.cur=(G.cur+1)%G.players.length;G.players.length>1?pass():turn()}
function finish(){
  const p=G.players[G.cur],ys=p.tl.map(x=>x.y);
  $('#app').innerHTML=`<div class="center"><p class="sub">${G.players.length>1?'המנצח/ת':'הגעתם ליעד'}</p><div class="name" style="margin-top:6px">${p.n}</div>
  <p class="sub">${p.tl.length} שירים על הציר, מ־${Math.min(...ys)} עד ${Math.max(...ys)}</p></div>
  <div class="tl" style="margin-top:16px">${p.tl.map(x=>songRow(x)).join('')}</div>
  <button class="big" onclick="home()">משחק חדש</button>`;
}
function home(){
  stopAudio();
  $('#app').innerHTML=`<h1>ציר</h1><p class="sub">שומעים, מנחשים שנה, בונים ציר זמן מוזיקלי.</p>
  <h2>חבילת שירים</h2><div class="row">${[['intl','בינלאומית'],['isr','ישראלית'],['mix','מעורב']].map(([k,n])=>`<button class="pack ${G.pack==k?'on':''}" onclick="G.pack='${k}';home()">${n}</button>`).join('')}</div>${G.pack!='intl'?'<p class="note" style="text-align:start">החבילה הישראלית עדיין טיוטה: 22 שירים, בעיקר מהאירוויזיון, והשנים טרם אומתו.</p>':''}
  <h2>כמה שחקנים?</h2><div class="row">${[1,2,3,4].map(n=>`<button class="pack ${G.cnt==n?'on':''}" onclick="G.cnt=${n};syncNames();home()">${n}</button>`).join('')}</div>
  <h2>שמות</h2>${Array.from({length:G.cnt},(_,i)=>`<input id="n${i}" placeholder="שחקן ${i+1}" value="${G.names[i]}" maxlength="14" oninput="G.names[${i}]=this.value">`).join('')}
  <h2>יעד לניצחון</h2><div class="row">${[7,10,15].map(n=>`<button class="pack ${G.target==n?'on':''}" onclick="G.target=${n};home()">${n} שירים</button>`).join('')}</div>
  <div class="row" style="margin-top:18px;align-items:center"><button onclick="beep()">בדיקת שמע</button><span id="snd" class="sub" style="margin:0"></span></div>
  <button class="big" onclick="start()">יוצאים לדרך</button>`;
}
function syncNames(){}
home();
</script>
</body>
</html>
